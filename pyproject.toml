[project]
name = "codex-colab-runner"
version = "0.2.0"
description = "Safe, observable Google Colab CLI workloads for Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==2.14.5",
    "google-colab-cli==0.6.0",
    "nbformat>=5.10,<6",
]

[project.scripts]
colab-runner-mcp = "colab_runner.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["colab_runner*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires authenticated access to a real Google Colab runtime",
]
